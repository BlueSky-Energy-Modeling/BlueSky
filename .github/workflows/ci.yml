name: CI

on:
  push:
    branches:
      [
        "main",
        "dev",
      ]
  pull_request:
    branches:
      [
        "main",
        "dev",
      ]

jobs:
  test:
    name: setup and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.6"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        env:
          CI: 1
        run: uv run pytest unit_tests
